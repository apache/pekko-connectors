name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 1.0.x
      - 1.1.x
      - 1.2.x
      - 1.3.x
    tags-ignore:
      - v*

concurrency:
  # Only run once for latest commit per ref and cancel other (previous) runs.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-pr:
    name: Classify root README changes
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout exact PR merge
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Prove that only the existing root README changed
        id: classify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(("git", *args))

          def readme_only(before, after):
              # Compare a single NUL-delimited raw record. Adds, deletes, mode
              # changes and rename pairs must all run the existing jobs.
              raw = git("diff", "--raw", "-z", "--no-abbrev", "--no-renames", "--no-ext-diff",
                        "--no-textconv", "--ignore-submodules=none", before, after, "--")
              return re.fullmatch(rb":100644 100644 [0-9a-f]{40} [0-9a-f]{40} M\x00README\.md\x00", raw)

          base, head, merge = (os.environ[k] for k in ("PR_BASE_SHA", "PR_HEAD_SHA", "GITHUB_SHA"))
          if all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head, merge)):
              checked_out = git("rev-parse", "HEAD").decode("ascii").strip()
              parents = git("rev-list", "--parents", "-n", "1", merge).decode("ascii").split()
              if checked_out == merge and parents == [merge, base, head]:
                  merge_bases = git("merge-base", "--all", base, head).decode("ascii").split()
                  # Require both the PR's own delta and its final merge delta.
                  if len(merge_bases) == 1 and readme_only(merge_bases[0], head) and readme_only(base, merge):
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("docs_only=true\n")
          PYTHON

  style-compile-mima:
    name: Compile, Code Style, Binary Compatibility
    runs-on: ubuntu-22.04
    if: github.repository == 'apache/pekko-connectors'
    env:
      JAVA_OPTS: -Xms2G -Xmx3G -Xss2M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v6.4.7

      - name: "Code style, compile tests, MiMa"
        run: |-
          scala_2_13="$(sed -n 's/.*val Scala213 = "\(.*\)".*/\1/p' project/Dependencies.scala)"
          scala_3="$(sed -n 's/.*val Scala3 = "\(.*\)".*/\1/p' project/Dependencies.scala)"
          scala_3_next="$(sed -n 's/.*val Scala3Next = "\(.*\)".*/\1/p' project/Dependencies.scala)"
          sbt "checkCodeStyle; ++${scala_2_13}! Test/compile; ++${scala_3}! Test/compile; ++${scala_3_next}! Test/compile; ++${scala_2_13}! mimaReportBinaryIssues; ++${scala_3}! mimaReportBinaryIssues"

      - name: "Integration Test Compile"
        run: sbt "+aws-spi-pekko-http-int-tests/Test/compile"

  documentation:
    name: ScalaDoc, Documentation with Paradox
    runs-on: ubuntu-22.04
    if: github.repository == 'apache/pekko-connectors'
    env:
      JAVA_OPTS: -Xms2G -Xmx3G -Xss2M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Build Documentation
        run: |-
          sbt docs/paradox unidoc

  connectors:
    needs: classify-pr
    if: >-
      ${{ always() && !cancelled() &&
          github.repository == 'apache/pekko-connectors' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { connector: amqp,                         pre_cmd: 'docker compose up -d amqp' }
          - { connector: avroparquet }
          - { connector: aws-spi-pekko-http }
          - { connector: awslambda }
          - { connector: aws-event-bridge,             pre_cmd: 'docker compose up -d amazoneventbridge' }
          - { connector: azure-storage-queue }
          - { connector: cassandra,                    pre_cmd: 'docker compose up -d cassandra' }
          - { connector: couchbase,                    pre_cmd: 'docker compose up -d couchbase7_prep' }
          - { connector: couchbase3,                   pre_cmd: 'docker compose up -d couchbase8_prep' }
          - { connector: csv }
          - { connector: dynamodb,                     pre_cmd: 'docker compose up -d dynamodb' }
          - { connector: elasticsearch,                pre_cmd: 'docker compose up -d elasticsearch6 elasticsearch7 elasticsearch8 elasticsearch9 opensearch2 opensearch3' }
          - { connector: file }
          - { connector: ftp,                          pre_cmd: './scripts/ftp-servers.sh' }
          - { connector: geode,                        pre_cmd: 'docker compose up -d geode' }
          - { connector: google-cloud-bigquery }
          - { connector: google-cloud-bigquery-storage }
          - { connector: google-cloud-pub-sub,         pre_cmd: 'docker compose up -d gcloud-pubsub-emulator_prep' }
          - { connector: google-cloud-pub-sub-grpc,    pre_cmd: 'docker compose up -d gcloud-pubsub-emulator_prep' }
          - { connector: google-cloud-storage }
          - { connector: google-common }
          - { connector: google-fcm }
          - { connector: hbase }
          - { connector: hdfs }
          - { connector: huawei-push-kit }
          - { connector: influxdb,                     pre_cmd: 'docker compose up -d influxdb' }
          - { connector: jakartams,                    pre_cmd: 'docker compose up -d ibmmq' }
          - { connector: jms,                          pre_cmd: 'docker compose up -d ibmmq' }
          - { connector: json-streaming }
          - { connector: kinesis }
          - { connector: kudu,                         pre_cmd: 'docker compose up -d kudu-master kudu-tserver' }
          - { connector: mongodb,                      pre_cmd: 'docker compose up -d mongo' }
          - { connector: mqtt,                         pre_cmd: 'docker compose up -d mqtt' }
          - { connector: mqttv5,                       pre_cmd: 'docker compose up -d mqtt' }
          - { connector: mqtt-streaming,               pre_cmd: 'docker compose up -d mqtt' }
          - { connector: orientdb,                     pre_cmd: 'docker compose up -d orientdb' }
          - { connector: pravega,                      pre_cmd: 'docker compose up -d pravega'}
          - { connector: reference }
          - { connector: s3 }
          - { connector: spring-web }
          - { connector: simple-codecs }
          - { connector: slick }
          - { connector: sns,                          pre_cmd: 'docker compose up -d amazonsns' }
          - { connector: solr }
          - { connector: sqs,                          pre_cmd: 'docker compose up -d elasticmq' }
          - { connector: sse }
          - { connector: text }
          - { connector: udp }
          - { connector: unix-domain-socket }
          - { connector: xml }

    env:
      JAVA_OPTS: -Xms2G -Xmx3G -Xss2M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v6.4.7

      - name: ${{ matrix.connector }}
        env:
          CONNECTOR: ${{ matrix.connector }}
          PRE_CMD: ${{ matrix.pre_cmd }}
        run: |-
          $PRE_CMD
          sbt "+${CONNECTOR}/test"

      - name: Print logs on failure
        if: failure()
        run: find . -name "*.log" -exec ./scripts/cat-log.sh {} \;

  connectors-windows:
    needs: classify-pr
    if: >-
      ${{ always() && !cancelled() &&
          github.repository == 'apache/pekko-connectors' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { connector: file }
          - { connector: ftp, test_cmd: 'ftp/testOnly org.apache.pekko.stream.connectors.ftp.impl.*' }

    env:
      JAVA_OPTS: -Xms2G -Xmx3G -Xss2M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v6.4.7

      - name: ${{ matrix.connector }}
        shell: bash
        env:
          CONNECTOR: ${{ matrix.connector }}
          TEST_CMD: ${{ matrix.test_cmd }}
        run: |-
          if [ -n "$TEST_CMD" ]; then
            sbt "+${TEST_CMD}"
          else
            sbt "+${CONNECTOR}/test"
          fi
